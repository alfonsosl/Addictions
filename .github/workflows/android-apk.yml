# Compila la app Android (APK instalable) y la publica en "Releases" del repositorio.
# Se ejecuta en cada push a la rama principal y también a mano (Actions → APK Android → Run workflow).
name: APK Android

on:
  push:
    branches: [claude/hopeful-dijkstra-jrpd7b]
    paths-ignore: ['README.md', 'AGENTS.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobaciones (tipos y tests)
        run: |
          npm run typecheck
          npm test

      - name: Generar proyecto nativo Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk Vigilia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vigilia-apk
          path: Vigilia.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" Vigilia.apk \
            --target "${{ github.sha }}" \
            --title "Vigilia ${VERSION} (compilación ${{ github.run_number }})" \
            --latest \
            --notes "APK de prueba para Android. Ábrelo desde el móvil, descarga **Vigilia.apk** e instálalo (Android pedirá permiso para instalar apps de origen desconocido)."
